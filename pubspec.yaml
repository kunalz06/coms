name: comms_flutter
description: COMMS Flutter client for web.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  firebase_messaging: ^15.2.5
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.17
  go_router: ^14.8.1
  dio: ^5.8.0
  web_socket_channel: ^3.0.2
  flutter_webrtc: ^0.12.11
  flutter_secure_storage: ^9.2.4
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  file_picker: ^9.2.1
  record: ^6.0.0
  just_audio: ^0.9.46
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  url_strategy: ^0.3.0
  share_plus: ^10.0.2
  image: ^4.2.0
  crypto: ^3.0.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
